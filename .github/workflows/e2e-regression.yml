name: E2E Regression

on:
  pull_request:
    branches: [devel]
  # nightly, to also catch regressions caused by changes outside of this repository
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: E2E Regression (NG Regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'v26.7.0'

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Start isolated JoinMarket NG regtest services with makers
        run: npm run e2e:regression:up

      - name: Run Playwright smoke and regression tests
        run: npm run test:e2e:regression

      - name: Capture service logs on failure
        if: failure()
        run: |
          mkdir -p test-results
          npm run --silent e2e:smoke:logs > test-results/docker-compose-regression.log 2>&1 || true

      - name: Upload regression evidence & test artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: e2e-regression-evidence
          path: |
            test-evidence/
            test-results/
            playwright-report/
          retention-days: 14

      - name: Teardown isolated containers
        if: always()
        run: npm run e2e:smoke:down
