name: Build Storybook

on:
  pull_request:
    branches:
      - devel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm clean-install --no-audit --no-fund

      - name: Build Storybook
        run: npm run storybook:build
