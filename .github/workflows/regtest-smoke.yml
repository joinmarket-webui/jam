name: Regtest Smoke

on:
  push:
    branches: [master, devel, 'test/**']
  pull_request:
    branches: [master, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: NG Regtest Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'v26.7.0'

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Start isolated JoinMarket NG regtest services
        run: bash tests/e2e/smoke-setup.sh up

      - name: Run Playwright smoke test journey
        run: npm run test:smoke

      - name: Capture service logs on failure
        if: failure()
        run: |
          mkdir -p test-results
          bash tests/e2e/smoke-setup.sh logs > test-results/docker-compose-smoke.log 2>&1 || true

      - name: Upload smoke evidence & test artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: regtest-smoke-evidence
          path: |
            test-evidence/
            test-results/
            playwright-report/
          retention-days: 14

      - name: Teardown isolated containers
        if: always()
        run: bash tests/e2e/smoke-setup.sh down
